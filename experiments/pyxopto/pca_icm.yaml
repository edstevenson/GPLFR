# Default PyXOpto benchmark config (single run).
data_path: data/refl.npz
split_path: data/split1205_500_500s0.npz

out_dir: ROOT/experiments/pyxopto/pcaicm
eval_set: test
emulators: [pca_icm]

# Preprocessing: log10(Y + eps) before per-radius z-scoring.
log_eps: 1.0e-8
save_model: false

simplex: {}

pca_icm:
  n_components: 25
  kernel: rbf          # rbf | matern32 | matern52
  per_latent_kernel: true  # if true, allow per-score k_x hyperparams
  per_latent_noise: false   # if false, share sigma_z2 across PCA components
  train_hyperparams: true
  num_steps: 3000
  lr: 0.01
  early_stop_patience_evals: 8
  early_stop_min_delta: 0.0
  log_every: 100
  verbose: false
  random_seed: 0
  device: auto
  dtype: float64

pca_mlp:
  n_components: 25
  hidden_width: 128
  train_hyperparams: true
  num_steps: 3000
  lr: 1.0e-3
  weight_decay: 1.0e-3
  early_stop_patience_evals: 8
  early_stop_min_delta: 0.0
  log_every: 100
  verbose: false
  random_seed: 0
  device: auto
  dtype: float64

sweep:
  enabled: true
  parallel_seeds: true
  name: pcaicm-n25--800-z7-s0--4
  emulators: [pca_icm]
  grid:
    n_train: [25, 50, 100, 200, 400, 800]   # must be divisible by n_tasks (=5)
    pca_icm:
      n_components: [7] #[2,3,5,7,10,14,20,28,40,56]
    pca_mlp:
      n_components: [7]
      hidden_width: [128]
      weight_decay: [1.0e-3]
  seeds: [0, 1, 2, 3, 4]
  parallel_seeds: true
  slurm:
    enabled: true
    partition: pvc9
    account_cpu: ""
    account_gpu: ""
    account_dawn: PION-P8-DAWN-GPU
    cpus_per_task: 12
    time: "06:00:00"
    gres: "gpu:1"
