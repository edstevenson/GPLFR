# Default PyXOpto benchmark config (single run).
data_path: data/refl.npz
split_path: data/split1540_330_335s0.npz

out_dir: ROOT/experiments/pyxopto/default
eval_set: test
emulators: [simplex]
max_train: null

# Preprocessing: log10(Y + eps) before per-radius z-scoring.
log_eps: 1.0e-8
simplex: {}

sweep:
  enabled: true
  parallel_seeds: false
  name: simplex-test
  emulators: [simplex]
  grid:
    n_train: [25, 50, 100,200, 400]   # must be divisible by n_tasks (=5)
  seeds: [0, 1, 2]
