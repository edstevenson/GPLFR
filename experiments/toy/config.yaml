# Example sweep config for toy (latent-budget / learning-curve sweeps)

data_path: data/data.npz
split_path: data/split1600_500_500-s0.npz
out_dir: ROOT/experiments/toy1/run

emulators: [pca_gp, gplfr]

pca_gp:
  n_components: 8
  kernel: rbf
  sigma_xi2_mode: float    # shared | per-latent | float
  sigma_xi2: 1.0e-6        # init (shared/per-latent) or fixed (float)
  train_hyperparams: true
  device: auto
  dtype: float64
  early_stop_metric: rmse_val_obs   # mae_val | rmse_val_obs | rmse_val_sig
  early_stop_patience_evals: null   # requires val_idx in split when >0
  early_stop_min_delta: 0.0
  log_every: 100
  verbose: false
  opt_kwargs:
    method: L-BFGS-B
    maxiter: 500
    n_restarts: 0
    restart_jitter: 0.1
    restart_seed: 0
gplfr:
  latent_dim: 4
  kernel: rbf
  ell_mode: shared
  sigma_f_mode: shared
  tau: 1.0
  tau_schedule:
    enabled: false
    kind: exp   # exp | linear
    start: 1.0
    end: 1.0
  homotopy:
    likelihood_tempering:
      enabled: false
      range: [0.0, 0.1]  # beta schedule for data_fit_scale; data_fit_scale = beta
      num_steps_fraction: 0.5
    nugget_schedule:
      enabled: false
      range: [1.0e-1, 1.0e-6]  # log-linear schedule for extra GP nugget added to sigma_xi2
      num_steps_fraction: 0.5
  sigma_xi2_mode: float       # float | shared | per_latent
  sigma_xi2: 1.0e-6           # fixed (float) or init (learned)
  jitter: 1.0e-6
  n_restarts: 0
  num_steps: 4000
  lr_Z: 1.0e-2
  lr_global: 1.0e-2
  frozen_Z_start: 0.0
  log_every: 50
  early_stop_patience_evals: 10
  early_stop_min_delta: 0.0
  random_seed: 0
  verbose: true
  device: auto
  dtype: float64
  pca_init:
    enabled: false
    whiten_scores: false
    init_sigma_f: null  # null | pca
  linear_trend:
    enabled: false
    lambda: 1.0e-3
    design:
      intercept: true
      inputs: true

sweep:
  enabled: true
  name: pcagp-n25--200-z4-8-12-s0--4
  emulators: [pca_gp]
  seeds: [0, 1, 2, 3, 4]
  # Example: submit this sweep to SLURM (mimics pyxopto.sweep)
  # slurm:
  #   enabled: true
  #   partition: pvc9
  #   account_dawn: <your-account>
  #   account_cpu: <your-account>   # used on CPU partitions
  #   account_gpu: <your-account>   # used on ampere
  #   cpus_per_task: 16
  #   time: "02:00:00"
  #   gres: "gpu:1"   # required on pvc9/ampere
  grid:
    n_train: [25, 50, 100, 200]
    pca_gp:
      n_components: [4, 8, 12]
    gplfr:
      latent_dim: [4, 8, 12]
