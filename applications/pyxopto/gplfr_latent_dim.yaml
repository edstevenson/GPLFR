# Default PyXOpto benchmark config (single run).
data_path: data/refl.npz
split_path: data/split1205_500_500s0.npz

out_dir: ROOT/experiments/pyxopto/gplfr-current-best
eval_set: test
emulators: [gplfr]

# Preprocessing: log10(Y + eps) before per-radius z-scoring.
log_eps: 1.0e-8
save_model: false

simplex: {}

pca_icm:
  n_components: 25
  kernel: rbf          # rbf | matern32 | matern52
  per_latent_kernel: true  # if true, allow per-score k_x hyperparams
  per_latent_noise: true   # if false, share sigma_z2 across PCA components
  train_hyperparams: true
  num_steps: 200
  lr: 5.0e-2
  random_seed: 0
  device: auto
  dtype: float64

gplfr:
  n_train: 200             # null = use full train split; int = balanced subsample
  latent_dim: 10
  kernel: rbf          # rbf | matern32 | matern52
  ell_mode: per_latent          # shared | per_latent
  coreg_mode: lkj           # lkj | icm
  eta_lkj: 1.0
  tau: 1.0
  tau_schedule: {enabled: false, kind: exp, start: 1.0, end: 1.0}
  sigma_f_mode: null          # null | per_latent
  sigma_xi2_mode: float       # float | shared | per_latent
  sigma_xi2: 1.0e-6
  jitter: 1.0e-6
  num_steps: 5000
  lr_Z: 0.01
  lr_global: 0.01
  lr_gamma: 0.999
  frozen_Z_start: 0.2
  log_every: 100
  record_loss_curve: false
  early_stop_patience_evals: 8
  early_stop_min_delta: 0.0
  random_seed: 0
  verbose: true
  device: auto
  dtype: float64
  pca_init:
    enabled: true
    whiten_scores: true
    init_sigma_f: null  # null | pca

sweep:
  enabled: true
  parallel_seeds: false
  name: gplfr-n400-z5--80-s0--4-lrg0.01
  emulators: [gplfr]
  grid:
    n_train: [800]   # must be divisible by n_tasks (=5)
    gplfr:
      frozen_Z_start: [0.2]
      lr_global: [0.01]
      lr_Z: [0.01]
      latent_dim: [5, 10, 20, 40, 80]
  seeds: [0, 1, 2, 3, 4]
  slurm:
    enabled: true
    partition: pvc9
    account_cpu: ""
    account_gpu: ""
    account_dawn: PION-P8-DAWN-GPU
    cpus_per_task: 12
    time: "06:00:00"
    gres: "gpu:1"
