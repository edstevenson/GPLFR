[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gplfr"
version = "0.1.0"
description = "Domain-agnostic Bayesian latent-variable regression library"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "beartype>=0.16",
  "jaxtyping>=0.2.24",
  "numpy>=1.24",
  "pyro-ppl>=1.8",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = ["jupyter", "matplotlib", "pytest"]

[tool.setuptools]
packages = ["gplfr"]
